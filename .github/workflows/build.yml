
name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vue site
        run: npm run build

      - name: Finishing up
        run: |
          cp -r icons dist
          echo 'cemu.emiyl.com' >> dist/CNAME
          touch dist/.nojekyll

          for n in 404 instructions installation; do
            cp dist/index.html "dist/$n.html"
          done

          mkdir -p dist/titleid

          for n in $(node -e "console.log(Object.keys(require('./titles.json')).join(' '))"); do
            cp dist/index.html "dist/titleid/$n.html"
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          